  <rect x="32.0" y="180" width="120.2" height="22" rx="4" fill="none" stroke="#3f3f3f"/><text x="92.1" y="195" class="mono" font-size="11" letter-spacing="0.6" fill="#a3a3a3" text-anchor="middle">POWER AUTOMATE</text><rect x="160.2" y="180" width="91.0" height="22" rx="4" fill="none" stroke="#3f3f3f"/><text x="205.7" y="195" class="mono" font-size="11" letter-spacing="0.6" fill="#a3a3a3" text-anchor="middle">AI BUILDER</text><rect x="259.2" y="180" width="91.0" height="22" rx="4" fill="none" stroke="#3f3f3f"/><text x="304.7" y="195" class="mono" font-size="11" letter-spacing="0.6" fill="#a3a3a3" text-anchor="middle">SHAREPOINT</text><rect x="358.2" y="180" width="54.5" height="22" rx="4" fill="none" stroke="#3f3f3f"/><text x="385.4" y="195" class="mono" font-size="11" letter-spacing="0.6" fill="#a3a3a3" text-anchor="middle">TEAMS</text>
  
  <rect x="428" y="100" width="24" height="24" rx="4" fill="none" stroke="#a3a3a3" stroke-width="1.5"/>
