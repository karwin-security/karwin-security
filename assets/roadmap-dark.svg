    .mono { font-family: "JetBrains Mono", "SFMono-Regular", Menlo, Consolas, "Liberation Mono", monospace; }
    
    .step { opacity: 0; animation: in .7s ease-out forwards; }
    .prog { stroke-dasharray: 150; stroke-dashoffset: 150; animation: draw 1.6s cubic-bezier(.6,0,.2,1) .5s forwards; }
    .ping { animation: ping 2.2s ease-out infinite; }
