ize="11" letter-spacing="1.2" fill="#737373" text-anchor="middle">PLANNED</text></g><g class="step" style="animation-delay:0.70s"><text x="750" y="50" class="mono" font-size="12" letter-spacing="2" fill="#737373" text-anchor="middle">STEP 03</text><circle cx="750" cy="96" r="8" fill="#0a0a0a" stroke="#a3a3a3" stroke-width="1.5"/><text x="750" y="148" class="sans" font-size="26" font-weight="700" letter-spacing="-0.5" fill="#a3a3a3" text-anchor="middle">CRTO</text><text x="750" y="172" class="sans" font-size="14" fill="#a3a3a3" text-anchor="middle">Red Team Operator</text><text x="750" y="192" class="mono" font-size="11" letter-spacing="1" fill="#737373" text-anchor="middle">ZERO-POINT SECURITY</text><rect x="712.4" y="206" width="75.2" height="22" rx="11" fill="none" stroke="#3f3f3f"/><text x="750" y="221" class="mono" font-size="11" letter-spacing="1.2" fill="#737373" text-anchor="middle">PLANNED</text></g><g class="step" style="animation-delay:0.95s"><text x="1050" y="50" class="mono" font-size="12" letter-spacing="2" fill="#737373" text-anchor="middle">STEP 04</text><circle cx="1050" cy="96" r="8" fill="#0a0a0a" stroke="#a3a3a3" stroke-width="1.5"/><text x="1050" y="148" class="sans" font-size="26" font-weight="700" letter-spacing="-0.5" fill="#a3a3a3" text-anchor="middle">AWS</text><text x="1050" y="172" class="sans" font-size="14" fill="#a3a3a3" text-anchor="middle">Security — Specialty</text><text x="1050" y="192" class="mono" font-size="11" letter-spacing="1" fill="#737373" text-anchor="middle">AMAZON WEB SERVICES</text><rect x="1012.4" y="206" width="75.2" height="22" rx="11" fill="none" stroke="#3f3f3f"/><text x="1050" y="221" class="mono" font-size="11" letter-spacing="1.2" fill="#737373" text-anchor="middle">PLANNED</text></g>
